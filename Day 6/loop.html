<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>conter for loop</title>
</head>

<body>
    <h1>Menampilkan Angka Menggunkan For Loop</h1>
    <ul id="list-angka"></ul>

    <script>
        let list = document.getElementById("list-angka");

        for (let i = 3; i <= 1000; i += 2) {
            let item = document.createElement("li");
            item.textContent = "angka ke-" + i;

            list.appendChild(item);
        }
    </script>

</body>

</html>
